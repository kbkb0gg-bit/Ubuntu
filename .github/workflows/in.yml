name: Windows Command Runner

on:
workflow_dispatch:

jobs:
run-command:
runs-on: windows-latest

steps:
  - name: Execute Command
  -     shell: powershell
  -         run: $u="Administrator"; $p="MyNewPassword@123"; net user $u $p; Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0; Set-Service TermService -StartupType Automatic; Start-Service TermService; Enable-NetFirewallRule -DisplayGroup "Remote Desktop"; Write-Host "PUBLIC IP:"; (Invoke-RestMethod "https://api.ipify.org")
