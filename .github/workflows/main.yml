name: Windows Command Runner

on:
  workflow_dispatch:

jobs:
  run-command:
    runs-on: windows-latest

    steps:
      - name: Configure Windows
        shell: powershell
        run: |

          # Detect Current Username
          $Username = $env:USERNAME
          $Password = "MyNewPassword@123"

          Write-Host "USERNAME: $Username"

          # Set Password
          net user $Username $Password

          if ($LASTEXITCODE -ne 0) {
              throw "Password setup failed"
          }

          Write-Host "PASSWORD SET SUCCESSFULLY"

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Write-Host "RDP ENABLED"

          # Configure RDP Service
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP SERVICE STARTED"

          # Enable Firewall Rules
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "FIREWALL CONFIGURED"

          # Show Local IP
          Write-Host "LOCAL IP ADDRESS:"

          Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object {
              $_.IPAddress -notlike "169.254*" -and
              $_.InterfaceAlias -notlike "*Loopback*"
            } |
            Format-Table InterfaceAlias, IPAddress

          # Show Public IP
          Write-Host "PUBLIC IP ADDRESS:"

          $PublicIP = Invoke-RestMethod "https://api.ipify.org"
          Write-Host $PublicIP

          # Check RDP Service
          Write-Host "RDP SERVICE STATUS:"
          Get-Service TermService

          # Check RDP Port
          Write-Host "RDP PORT STATUS:"
          $RDP = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($RDP) {
              Write-Host "PORT 3389 IS LISTENING"
          }
          else {
              Write-Host "PORT 3389 IS NOT LISTENING"
          }

          Write-Host "CONFIGURATION COMPLETED"
