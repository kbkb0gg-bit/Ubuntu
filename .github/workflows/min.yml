name: Windows Command Runner

on:
  workflow_dispatch:

jobs:
  run-command:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Windows
        shell: powershell
        run: |

          # Detect Username
          $Username = $env:USERNAME

          Write-Host "USERNAME: $Username"

          # Show Local IP
          Write-Host "LOCAL IP:"

          Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object {
              $_.IPAddress -notlike "169.254*" -and
              $_.InterfaceAlias -notlike "*Loopback*"
            } |
            Format-Table InterfaceAlias, IPAddress

          # Show Public IP
          Write-Host "PUBLIC IP:"

          $PublicIP = Invoke-RestMethod "https://api.ipify.org"
          Write-Host $PublicIP

          # Show Windows Version
          Write-Host "WINDOWS VERSION:"
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion

          # Show Current Time
          Write-Host "CURRENT TIME:"
          Get-Date

          Write-Host "CONFIGURATION COMPLETED"
